<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f4; /* Light gray background */
        }

        h1 {
            text-align: center;
            color: #333; /* Dark gray heading color */
        }

        form {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px; 
            border: 1px solid #ccc; 
            border-radius: 5px;
            background-color: #fff; /* White form background */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle box shadow */
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555; /* Darker gray label color */
        }

        input[type="text"],
        input[type="email"],
        textarea,
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box; /* Include padding and border in width */
        }

        textarea {
            height: 100px;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.3s ease; 
        }

        button[type="submit"]:hover {
            background-color: #45a049; 
        }
    </style>
</head>
<body>

    <h1>Application Form</h1>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        
        

        

        <label for="education">Education Level:</label>
        <select id="education" name="education" required>
            <option value="">Select</option>
            <option value="highschool">beginners</option>
            <option value="undergraduate">intermdyet</option>
            <option value="graduate">advanced</option>
        </select>

        <label for="course">Course of Interest:</label>
        <input type="text" id="course" name="course" required>

        <button type="submit">Submit Application</button>
    </form>

</body>
</html>
